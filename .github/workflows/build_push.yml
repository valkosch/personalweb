name: Build and Update Helm

on:
  push:
    tags:
      - 'v*'
jobs:
  build-push-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ secrets.HARBOR_URL }} -u ${{ secrets.HARBOR_USERNAME }} --password-stdin

      - name: Build and push App
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/valko-webapp:latest
            ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/valko-webapp:${{ github.ref_name }}

      - name: Update Helm Chart
        env:
          NEW_VERSION: ${{ github.ref_name }} # Uses the tag directly
          HELM_REPO_PAT: ${{ secrets.HELM_REPO_PAT }}
          HELM_REPO_URL: github.com/valkosch/helm-charts
          VALUES_FILE_PATH: ./personal-helm/values.yaml
        run: |
          git clone https://x-access-token:${HELM_REPO_PAT}@${HELM_REPO_URL} helm-repo
          cd helm-repo
          
          git config user.name "Semantic Release Bot"
          git config user.email "bot@example.com"
          
          # Strip the 'v' from the tag if your Helm chart expects pure numbers (optional)
          # CLEAN_VERSION="${NEW_VERSION#v}"
          
          sed -i "s/tag: .*/tag: \"$NEW_VERSION\"/" $VALUES_FILE_PATH
          
          git add $VALUES_FILE_PATH
          git commit -m "chore(release): update image tag to $NEW_VERSION [skip ci]"
          git push

      - name: Logout
        if: always()
        run: docker logout ${{ secrets.HARBOR_URL }}
